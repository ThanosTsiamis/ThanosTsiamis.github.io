page_subtitle: Continuously updated
magnus_opus:
  title: My magnus opus
  description: >-
    FIONA: short for "Finding Outliers in Attributes," is an innovative framework
    designed for the detection of categorical outliers within datasets. This
    configuration-free and user-friendly tool specializes in identifying unusual
    patterns in data attributes, making it invaluable for data analysis and
    decision-making processes. FIONA is developed as part of my Master's thesis.
